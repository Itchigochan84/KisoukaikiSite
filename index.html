<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>希創回記</title>
    <style>
        /* ─── 基本スタイル ─── */
        body { font-family: sans-serif; background: #1A1A1A; margin: 0; padding: 20px; color: #F5F5F5; }
        .container { max-width: 900px; margin: 0 auto; background: #1C1C1C; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #628bfd; }
        
        /* 選択トップメニュー */
        .menu-select { display: flex; justify-content: space-around; margin: 30px 0; gap: 20px; }
        .btn { flex: 1; padding: 20px; font-size: 18px; font-weight: bold; cursor: pointer; border: none; background: #2c3e50; color: white; border-radius: 8px; transition: 0.2s; text-align: center; }
        .btn:hover { background: #34495e; transform: translateY(-2px); }
        .btn-back { padding: 10px 20px; background: #7f8c8d; color: white; border: none; border-radius: 4px; cursor: pointer; }
        
        /* セクション切り替え */
        .content-section { display: none; }
        .content-section.active { display: block; }
        
        /* ─── 小説コーナーのスタイル ─── */
       /* 外枠：深いダークグレーに変更 */
.hen-box { 
    background: #1e272e; 
    border: 1px solid #2f3640; 
    border-radius: 8px; 
    padding: 20px; 
    margin-bottom: 20px; 
}

/* 見出し：文字色を明るい白に変え、下線も白っぽく調整 */
.hen-title { 
    margin: 0 0 10px 0; 
    color: #f5f6fa; 
    font-size: 18px; 
    border-bottom: 2px solid #718093; 
    padding-bottom: 5px; 
}

/* あらすじ：背景をさらに深い黒、文字を薄いグレーにして読みやすく。左の赤線は維持 */
.hen-summary { 
    font-size: 14px; 
    color: #dcdde1; 
    margin: 0 0 15px 0; 
    line-height: 1.5; 
    background: #182026; 
    padding: 10px; 
    border-left: 4px solid #7a0b0b; 
    border-radius: 0 4px 4px 0; 
}

/* グリッド構造（維持） */
.episode-list { 
    list-style: none; 
    padding: 0; 
    margin: 0; 
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
    gap: 10px; 
}

/* 通常のリンク：ダークモード仕様（黒背景、白っぽい文字、グレーの枠） */
.episode-list a { 
    display: block; 
    background: #2f3640; 
    border: 1px solid #718093; 
    padding: 12px; 
    border-radius: 4px; 
    color: #f5f6fa; 
    text-decoration: none; 
    font-size: 14px; 
    transition: 0.2s; 
    font-weight: bold; 
}

/* 通常リンクのホバー：少し明るいグレーに変化 */
.episode-list a:hover { 
    background: #353b48; 
    border-color: #f5f6fa; 
}

/* 【ここから下は変更なし】みりおり（重要）リンクの明るい和風・ゴールド配色を完全に維持 */
.episode-list a.miriori-link { 
    background: #fdfaf6; 
    border-color: #e1b12c; 
    color: #b33939; 
}

/* みりおりリンクのホバー（維持） */
.episode-list a.miriori-link:hover { 
    background: #ffeaa7; 
}
        
        /* 読書画面 */
       /* 小説カード：深夜の読書に最適な深い色合いに */
.novel-card { 
    background: #181c20; 
    color: #e2e2e2; 
    padding: 40px; 
    border-radius: 8px; 
    box-shadow: 0 4px 20px rgba(0,0,0,0.3); 
    font-family: "YuMincho", "Hiragino Mincho ProN", serif; 
    border: 1px solid #2c3136; 
}

/* 本文レイアウト（余白・フォント設定は完全に維持） */
.novel-text-content { 
    font-size: 18px; 
    line-height: 2.3; 
    letter-spacing: 0.08em; 
    margin-top: 30px; 
    white-space: pre-wrap; 
}

        /* ─── キャラクターコーナーのスタイル ─── */
       /* 検索窓：ダークモード仕様（背景を暗く、文字を明るくして枠線を馴染ませる） */
.search-box { 
    width: 100%; 
    padding: 14px; 
    font-size: 16px; 
    margin-bottom: 25px; 
    background: #1e272e;
    color: #f5f6fa;
    border: 1px solid #2f3640; 
    border-radius: 6px; 
    box-sizing: border-box; 
}
/* 検索窓のプレースホルダー（薄い文字）の色も調整 */
.search-box::placeholder {
    color: #718093;
}

/* グリッド構造（維持） */
.char-grid { 
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
    gap: 20px; 
}

/* キャラクターカード：深いダークグレーに変更 */
.char-card { 
    background: #2f3640; 
    border: 1px solid #353b48; 
    padding: 20px; 
    border-radius: 6px; 
    cursor: pointer; 
    transition: 0.2s; 
    box-shadow: 0 4px 10px rgba(0,0,0,0.15); 
    color: #f5f6fa; /* カード内の通常文字を白系に */
}

/* キャラカードのホバー：さらに浮き上がり、枠線と影を強調 */
.char-card:hover { 
    transform: translateY(-3px); 
    background: #353b48;
    border-color: #718093;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3); 
}

/* 属性・所属タグ：暗い背景に溶け込む渋いグレーに変更 */
.char-tag { 
    display: inline-block; 
    background: #1e272e; 
    padding: 2px 8px; 
    font-size: 11px; 
    border-radius: 3px; 
    margin: 2px; 
    font-weight: bold; 
    color: #718093; 
}

        /* ポップアップ（モーダルモーダル） */
/* モーダル背景（暗幕）：少しだけ暗さを増して、中央のボックスを引き立たせる */
.modal { 
    display: none; 
    position: fixed; 
    z-index: 1000; 
    left: 0; 
    top: 0; 
    width: 100%; 
    height: 100%; 
    background-color: rgba(0, 0, 0, 0.75); 
    overflow-y: auto; 
}

/* モーダルコンテンツ：真っ白から、高級感のある「深いダークグレー」に変更 */
.modal-content { 
    background-color: #1e272e; 
    margin: 40px auto; 
    max-width: 750px; 
    border-radius: 12px; 
    overflow: hidden; 
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); 
    animation: fadeIn 0.2s; 
    border: 1px solid #2f3640; /* 輪郭をくっきりさせる細い枠線を追加 */
}

@keyframes fadeIn { 
    from { opacity: 0; transform: translateY(-10px); } 
    to { opacity: 1; transform: translateY(0); } 
}

/* ヘッダー：背景が暗くなったので、文字を明るい白に固定 */
.modal-header { 
    padding: 20px; 
    color: #f5f6fa; 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
}

.close-btn { 
    font-size: 28px; 
    cursor: pointer; 
    background: none; 
    border: none; 
    color: #f5f6fa; 
}

/* ボディ（グリッド構造・レスポンシブは完全維持） */
.modal-body { 
    padding: 25px; 
    display: grid; 
    grid-template-columns: 220px 1fr; 
    gap: 25px; 
    color: #f5f6fa; /* 全体の文字色を白系に変更 */
}

@media (max-width: 600px) { 
    .modal-body { grid-template-columns: 1fr; } 
}

/* キャラクター画像：枠線を暗くし、画像の背景もダークに */
.char-image-box img { 
    width: 100%; 
    height: auto; 
    border-radius: 8px; 
    border: 1px solid #2f3640; 
    background: #182026; 
}

/* プロフィールリスト */
.profile-list { 
    list-style: none; 
    padding: 0; 
    margin: 0; 
    line-height: 2; 
    font-size: 14px; 
    color: #dcdde1; /* ほんのり優しいグレーにして読みやすく */
}

/* ステータス表：線を暗く調整 */
table { 
    width: 100%; 
    border-collapse: collapse; 
    margin-top: 10px; 
    font-size: 13px; 
}

table, th, td { 
    border: 1px solid #2f3640; 
}

th, td { 
    padding: 8px; 
    text-align: left; 
}

/* 表の見出し：カードより「一段階暗い黒」にしてメリハリをつける */
th { 
    background: #182026; 
    color: #f5f6fa;
}

td {
    color: #dcdde1;
}

/* 【重要数値】鮮やかな赤はそのまま維持！暗い背景でさらに引き立ちます */
.theory-val { 
    color: #ff4757; /* 暗い画面で見やすい、少し鮮やかな赤に微調整 */
    font-weight: bold; 
}

/* 【スキルブロック】みりおりと同系統の「ゴールド×ベージュ」の美しい和風・高級感を完全維持 */
.skill-block { 
    background: #fdfaf6; 
    border-left: 4px solid #e1b12c; 
    padding: 12px; 
    margin: 12px 0; 
    border-radius: 0 4px 4px 0; 
}

/* スキル内の文字（背景が明るいベージュなので、文字は暗い色のままキープ） */
.skill-name { 
    font-weight: bold; 
    color: #2c3e50; 
}

.skill-desc { 
    font-size: 13px; 
    margin-top: 5px; 
    color: #555; 
    line-height: 1.6; 
}
    /* 📱 スマホのときだけ小説を読みやすくする設定 */
@media (max-width: 600px) {
    .novel-card {
        padding: 25px 15px !important; /* 左右の余白を狭くして、文字が横に広く入るようにする */
        border-radius: 4px;
    }
    .novel-text-content {
        font-size: 16.5px !important; /* スマホに最適な少しだけ小ぶりな文字サイズにする */
        line-height: 2.1;             /* 行間をスマホで見やすい高さに微調整 */
        letter-spacing: 0.05em;       /* 文字の横の間隔を調整 */
    }
}

/* 💡 宇宙管理軍や世界観ページの中にある、キャラクター名リンクの「真っ白な背景」を完全に消し去る設定 */
.military-box a, 
.world-box a {
    color: #ffffff !important;           /* 文字の色を完璧な「白」にする */
    background: transparent !important;   /* ❌ くっついてきていた白い背景を100%完全に透明にする */
    border: none !important;             /* 余計な枠線を消す */
    padding: 0 !important;               /* 余計な隙間をゼロにする */
    box-shadow: none !important;         /* 影を消す */
    text-decoration: underline !important;/* リンクだと分かるように下線を引く */
    font-weight: bold !important;        /* 文字を太字にする */
    display: inline !important;          /* ボタン型ではなく、普通の文字として並べる */
}

/* マウスを乗せたときだけ少し薄いグレーにする演出 */
.military-box a:hover, 
.world-box a:hover {
    color: #cccccc !important;
}

/* 💡 マウスを乗せた（ホバーした）ときだけ少し色を変える演出（お好みで） */
.content-section a:hover {
    color: #cccccc !important;       /* マウスが乗ると少し薄いグレーになる */
}
        
    </style>
</head>
<body>

<!-- 🔔 コピペする場所：右上の更新履歴（通知ボタン風） -->
<div style="text-align: right; margin-bottom: 10px; position: relative;">
    <button class="btn-back" onclick="switchSection('news-section')" style="background: #e74c3c; position: relative;">
        📢 最新情報 <span id="news-badge" style="position: absolute; top: -5px; right: -5px; background: white; color: #e74c3c; border-radius: 50%; padding: 2px 6px; font-size: 10px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">0</span>
    </button>
</div>

<div class="container">
    <h1>希創回記の万能サイト</h1>
    
    <!-- 最初の選択メニュー -->
    <div class="menu-select">
        <button class="btn" onclick="switchSection('novel-section')">小説を読む</button>
        <button class="btn" onclick="switchSection('char-section')">キャラ設定を見る</button>
              <!-- 👇 この下の2行を新しく追加してください。背景色のコード（#2980b9など）は自由に変えて大丈夫です！ -->
        <button class="btn" onclick="switchSection('military-section')" style="background: #424257;">宇宙管理軍</button>
        <button class="btn" onclick="switchSection('world-section')" style="background: #424257;">世界観など</button>
    </div>

    <!-- 小説コーナー -->
    <div id="novel-section" class="content-section">
        <div id="novel-list-area">
            <h2>小説目次</h2>
            <div id="novel-container"></div>
            <button class="btn-back" onclick="hideAll()" style="margin-top:20px;">トップに戻る</button>
        </div>
        <div id="novel-viewer" style="display: none;">
            <button class="btn-back" onclick="closeNovelViewer()" style="margin-bottom: 20px;">目次に戻る</button>
            <div class="novel-card">
                <span id="novel-hen-title">編タイトル</span>
                <h2 id="novel-ep-title">話タイトル</h2>
                <div id="novel-body-text" class="novel-text-content"></div>
            </div>
            <button class="btn-back" onclick="closeNovelViewer()" style="margin-top: 30px;">目次に戻る</button>
        </div>
    </div>

    <!-- キャラ設定コーナー -->
    <div id="char-section" class="content-section">
        <h2>キャラクター検索</h2>
        <input type="text" id="searchBar" class="search-box" placeholder="名前や属性（例: レフィダー、1話）で検索..." onkeyup="filterCharacters()">
        <div id="char-grid" class="char-grid"></div>
        <button class="btn-back" onclick="hideAll()" style="margin-top:20px;">トップに戻る</button>
    </div>
</div>

<!-- 詳細ポップアップ -->
<div id="char-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header" id="modal-header">
            <h2 id="modal-name" style="margin:0;">名前</h2>
            <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="char-image-box">
                <img id="modal-img" src="" alt="キャラクター画像">
                <h4 style="margin: 15px 0 5px 0;">能力系統</h4>
                <table id="modal-ability-stats"></table>
            </div>
            <div>
                <h3>プロフィール</h3>
                <ul id="modal-profile" class="profile-list"></ul>
                <hr style="border:0; border-top:1px solid #eee; margin:15px 0;">
                <div id="modal-text-details"></div>
                <h3>戦闘ステータス</h3>
                <table id="modal-battle-stats"></table>
                <h3>複雑型の技</h3>
                <div id="modal-skills"></div>
            </div>
        </div>
    </div>

    <!-- 宇宙管理軍セクション -->
    <div id="military-section" class="content-section military-box">
        <h2>宇宙管理軍 記録室</h2>
        <div class="hen-box">
            <h3>部隊編成と職務</h3>
            <div id="military-units"></div>
        </div>
        <div class="hen-box">
            <h3>宇宙管理軍 入軍試験記録</h3>
            <div id="military-exams"></div>
        </div>
        <div class="hen-box" style="border-left: 4px solid #e67e22; background: #fffcf5;">
            <h3>宇宙管理軍 重大事件簿</h3>
            <div id="military-incidents"></div>
        </div>
        <button class="btn-back" onclick="hideAll()">トップに戻る</button>

    <!-- 世界観・用語・地理セクション -->
    <div id="world-section" class="content-section world-box">
        <h2>世界観などの説明</h2>
        <div class="hen-box">
            <h3>月界</h3>
            <div id="world-gekkay"></div>
        </div>
        <div class="hen-box">
            <h3>MTS</h3>
            <div id="world-mts"></div>
        </div>
        <div class="hen-box">
            <h3 id="world-unknown-title">？？</h3>
            <div id="world-unknown"></div>
        </div>
        <div class="hen-box">
            <h3>専門用語集</h3>
            <div id="world-terms"></div>
        </div>
        <div class="hen-box">
            <h3>地理・惑星・国家記録</h3>
            <div id="world-geography"></div>
        </div>
        <button class="btn-back" onclick="hideAll()">トップに戻る</button>
    </div>

    <!-- 更新履歴セクション -->
    <div id="news-section" class="content-section">
        <h2>📢 最新情報・更新履歴</h2>
        <div id="news-container" class="hen-box"></div>
        <button class="btn-back" onclick="hideAll()">トップに戻る</button>
    </div>
</div>
    
<script src="char.js"></script>
<script src="novel.js"></script>
<script src="world.js"></script>
<script src="main.js"></script>

<!-- 💡 【フリーズ強制解除コード】 index.html の </body> のすぐ上にこれをそのまま貼り付けてください -->
<style>
    /* どの部屋に迷い込んでいても、ボタンが押されたら最優先で画面に表示させる命令 */
    #military-section.active,
    #world-section.active,
    #news-section.active {
        display: block !important;
        position: relative !important;
        visibility: visible !important;
        opacity: 1 !important;
    }
</style>

<!-- 💡 index.html の一番下、<script src="main.js"></script> のすぐ下にある手書きの <script> 〜 </script> の中身を以下に差し替えます -->
<script>
    // 🎨 あなたの大改造コードを完全に守りつつ、画面切り替えとデータ組み立てを同時に行う処理
    window.switchSection = function(sectionId) {
        // 全ての画面を非表示にする
        document.querySelectorAll('.content-section').forEach(sec => {
            sec.classList.remove('active');
            sec.style.display = 'none';
        });
        const viewer = document.getElementById('novel-viewer');
        if (viewer) viewer.style.display = 'none';
        
        // 押されたボタンの部屋を【最優先】で画面に表示させる
        const targetSection = document.getElementById(sectionId);
        if (targetSection) {
            targetSection.classList.add('active');
            targetSection.style.display = 'block';
        }

        // 🚀 【追加】画面を開いた瞬間に、その部屋のデータをその場で強制的に組み立てる魔法の命令
        if (typeof militaryData !== 'undefined' && typeof worldData !== 'undefined') {
            const unitsDiv = document.getElementById('military-units');
            if (unitsDiv && unitsDiv.innerHTML === "") {
                unitsDiv.innerHTML = militaryData.units.map(u => `<div style="margin-bottom:15px;"><strong>■ ${u.name}</strong><br>【所属】${u.member}<br>【職務】${u.work}</div>`).join('');
            }
            const examsDiv = document.getElementById('military-exams');
            if (examsDiv && examsDiv.innerHTML === "") {
                examsDiv.innerHTML = militaryData.exams.map(e => `<div style="margin-bottom:15px; background:#fff; padding:10px; border:1px solid #eee;"><strong>🏆 ${e.title}</strong> (応募: ${e.applicants} / 合格: ${e.passedCount})<br>【推薦枠】${e.recommendations}<br>【合格者詳細】<br>${e.results.map(r => `・${r.name} (${r.score}) ➔ <strong>${r.status}</strong>`).join('<br>')}</div>`).join('');
            }
            const incidentsDiv = document.getElementById('military-incidents');
            if (incidentsDiv && incidentsDiv.innerHTML === "") {
                incidentsDiv.innerHTML = militaryData.incidents.map(i => `<div style="border-left:3px solid #d63031; padding-left:10px; margin-bottom:15px;"><h4 style="margin:0 0 5px 0;">📂 ${i.title}</h4><span style="font-size:12px; color:#666;">[著者] ${i.author} | [情報元] ${i.source}</span><p style="font-size:14px; line-height:1.6; margin-top:8px; white-space:pre-wrap;">${i.content}</p></div>`).join('');
            }
            const gekkayDiv = document.getElementById('world-gekkay');
            if (gekkayDiv && gekkayDiv.innerHTML === "") {
                gekkayDiv.innerHTML = `<p><b>リーダー:</b> ${worldData.gekkay.leader}</p><p><b>🌙 月の使者 序列リスト:</b><br>${worldData.gekkay.messengers.join('<br>')}</p>`;
            }
            const mtsDiv = document.getElementById('world-mts');
            if (mtsDiv && mtsDiv.innerHTML === "") {
                mtsDiv.innerHTML = `<p><b>リーダー:</b> ${worldData.mts.leader}</p><p><b>幹部序列:</b><br>${worldData.mts.executives.join('<br>')}</p><p><b>幹部候補序列:</b><br>${worldData.mts.candidates.join('<br>')}</p>`;
            }
            const unknownTitle = document.getElementById('world-unknown-title');
            if (unknownTitle) unknownTitle.textContent = `👁️ ${worldData.unknown.title}`;
            const unknownDiv = document.getElementById('world-unknown');
            if (unknownDiv && unknownDiv.innerHTML === "") {
                unknownDiv.innerHTML = `<p><b>序列リスト (1位〜12位):</b><br>${worldData.unknown.ranks.join('<br>')}</p>`;
            }
            const termsDiv = document.getElementById('world-terms');
            if (termsDiv && termsDiv.innerHTML === "") {
                termsDiv.innerHTML = worldData.terms.map(t => `<p><strong>【${t.word}】</strong><br>${t.detail}</p>`).join('');
            }
            const geoDiv = document.getElementById('world-geography');
            if (geoDiv && geoDiv.innerHTML === "") {
                geoDiv.innerHTML = worldData.geography.map(g => `<div style="margin-bottom:15px; background:#fff; padding:10px; border:1px solid #eee;"><strong>🪐 惑星: ${g.planet} / 🚩 国家: ${g.country}</strong><br>【経済】${g.economy}<br>【背景・特徴】${g.background}</div>`).join('');
            }
        }
    }
    
    // トップに戻るボタン
    window.hideAll = function() {
        document.querySelectorAll('.content-section').forEach(sec => {
            sec.classList.remove('active');
            sec.style.display = 'none';
        });
        const viewer = document.getElementById('novel-viewer');
        if (viewer) viewer.style.display = "none";
    }
</script>

</body>
</html>

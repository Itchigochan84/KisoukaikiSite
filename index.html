<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私の創作サイト</title>
    <style>
        /* 基本スタイル */
        body { font-family: sans-serif; background: #f5f5f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow:0 4px 15px rgba(0,0,0,0.05); }
        .menu-select { display: flex; justify-content: space-around; margin: 30px 0; }
        .btn { padding: 15px 30px; font-size: 18px; cursor: pointer; border: none; background: #2c3e50; color: white; border-radius: 5px; }
        .content-section { display: none; }
        .content-section.active { display: block; }
        
        /* キャラ一覧（カード型） */
        .search-box { width: 100%; padding: 12px; font-size: 16px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 6px; }
        .char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .char-card { background: #fff; border: 1px solid #eee; padding: 20px; border-radius: 6px; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .char-card:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .char-tag { display: inline-block; background: #e0e0e0; padding: 2px 8px; font-size: 12px; border-radius: 3px; margin: 2px; }

        /* ─── 詳細ポップアップ（モーダル）のスタイル ─── */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); overflow-y: auto; }
        .modal-content { background-color: #fff; margin: 40px auto; max-width: 700px; border-radius: 12px; overflow: hidden; box-shadow: 0 5px 25px rgba(0,0,0,0.2); animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        .modal-header { padding: 20px; color: white; display: flex; justify-content: space-between; align-items: center; }
        .close-btn { font-size: 28px; cursor: pointer; background: none; border: none; color: white; }
        .modal-body { padding: 25px; display: grid; grid-template-columns: 200px 1fr; gap: 20px; }
        @media (max-width: 600px) { .modal-body { grid-template-columns: 1fr; } } /* スマホ対応 */
        
        .char-image-box img { width: 100%; height: auto; border-radius: 8px; border: 1px solid #ddd; background: #eee; }
        .profile-list { list-style: none; padding: 0; margin: 0; line-height: 1.8; }
        
        /* テーブルのスタイル（ステータス用） */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        table, th, td { border: 1px solid #eee; }
        th, td { padding: 8px; text-align: left; }
        th { background: #f9f9f9; }
        .theory-val { color: #d63031; font-weight: bold; } /* 理論値を目立たせる赤字 */

        /* 技のスタイル */
        .skill-block { background: #fdfaf6; border-left: 4px solid #e1b12c; padding: 10px; margin: 10px 0; border-radius: 0 4px 4px 0; }
        .skill-name { font-weight: bold; color: #2c3e50; }
        .skill-desc { font-size: 13px; margin-top: 5px; color: #555; }
    </style>
</head>
<body>

<div class="container">
    <h1>創作ポータルサイト</h1>
    <div class="menu-select">
        <button class="btn" onclick="switchSection('novel-section')">📖 小説を読む</button>
        <button class="btn" onclick="switchSection('char-section')">👤 キャラ設定を見る</button>
    </div>

    <!-- 小説コーナー（今回は省略していますが前回のまま動きます） -->
    <div id="novel-section" class="content-section">
        <h2>小説目次</h2>
        <div id="novel-container"></div>
        <button onclick="hideAll()" style="margin-top:20px;">🏠 トップに戻る</button>
    </div>

    <!-- キャラ設定コーナー -->
    <div id="char-section" class="content-section active">
        <h2>キャラクター検索</h2>
        <input type="text" id="searchBar" class="search-box" placeholder="名前や属性（例: 憎悪、主人公）で検索..." onkeyup="filterCharacters()">
        <div id="char-grid" class="char-grid"></div>
        <button onclick="hideAll()" style="margin-top:20px;">🏠 トップに戻る</button>
    </div>
</div>

<!-- ─── 詳細ポップアップ用の画面（普段は隠れています） ─── -->
<div id="char-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header" id="modal-header">
            <h2 id="modal-name" style="margin:0;">名前</h2>
            <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <!-- 左側：画像と基本プロフ -->
            <div class="char-image-box">
                <img id="modal-img" src="" alt="キャラクター画像">
                <h4 style="margin: 15px 0 5px 0;">📊 能力系統</h4>
                <table id="modal-ability-stats"></table>
            </div>
            <!-- 右側：詳しい設定・ステータス -->
            <div>
                <h3>プロフィール</h3>
                <ul id="modal-profile" class="profile-list"></ul>
                <hr style="border:0; border-top:1px solid #eee; margin:15px 0;">
                <div id="modal-text-details"></div>
                
                <h3>⚔️ 戦闘ステータス</h3>
                <table id="modal-battle-stats"></table>

                <h3>🪄 複雑型の技</h3>
                <div id="modal-skills"></div>
            </div>
        </div>
    </div>
</div>

<script type="module" src="scripts/main.js"></script>
</body>
</html>
